# AQK-5: aggregate ACTUAL Gitea commit statuses even when a gate fails.
# All seven base checks must be successful; the summary is an eighth context.
when:
  - event: pull_request
    branch: main
    status: [success, failure]
  - event: push
    branch: main
    status: [success, failure]

labels:
  platform: linux/amd64
  role: build-linux

depends_on:
  - security-wake-x86
  - quality-detekt
  - quality-tests
  - quality-coverage
  - security-gitleaks
  - security-trivy
  - security-opengrep

steps:
  - name: consolidated-quality-summary
    image: python:3.13-alpine
    commands:
      - python3 scripts/ci/aqk5-quality-summary.py
