# AQK-5: no token or API calls. This workflow executes ONLY when every required
# upstream workflow succeeded. On any failure, it cannot publish false success.
# Gitea must require ALL five individual contexts, including this summary.
labels:
  platform: linux/arm64
  hostname: orangepi5

skip_clone: true

depends_on:
  - security-wake-x86
  - quality-detekt
  - quality-tests
  - quality-coverage

when:
  - event: pull_request
    branch: main
  - event: push
    branch: main

steps:
  - name: consolidated-quality-summary
    image: curlimages/curl:8.22.0
    commands:
      - |
        set -eu
        echo '===== AQK-5 CONSOLIDATED QUALITY SUMMARY ====='
        echo 'GATE | STATUS'
        echo 'security-wake-x86 | SUCCESS'
        echo 'quality-detekt | SUCCESS'
        echo 'quality-tests | SUCCESS'
        echo 'quality-coverage | SUCCESS'
        echo 'CHECKS=4'
        echo 'AQK_5_CONSOLIDATED_GATE=PASS'
