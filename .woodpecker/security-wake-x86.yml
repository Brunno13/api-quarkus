# AQK-5: infrastructure-only wake job. No Docker/Gradle/Mongo here.
# The endpoint URL is configured outside Git in Woodpecker (URL only, no token).
labels:
  platform: linux/arm64
  hostname: orangepi5

skip_clone: true
workspace:
  base: /tmp
  path: api-quarkus-ci-wake

when:
  - event: pull_request
    branch: main
  - event: push
    branch: main

steps:
  - name: wake-docker-x86
    image: curlimages/curl:8.22.0
    environment:
      CI_WAKE_DOCKER_X86_URL:
        from_secret: aqk_ci_wake_docker_x86_url
    commands:
      - |
        set -eu
        if [ -z "$${CI_WAKE_DOCKER_X86_URL:-}" ]; then
          echo 'SECURITY_WAKE_X86=FAIL (wake URL not configured)'
          exit 1
        fi
        response="$$(curl --fail --silent --show-error --max-time 120 \
          --request POST "$$CI_WAKE_DOCKER_X86_URL")"
        case "$$response" in
          *trigger_complete*|*already_in_progress*)
            echo 'SECURITY_WAKE_X86=PASS'
            ;;
          *)
            echo 'SECURITY_WAKE_X86=FAIL (unexpected response)'
            exit 1
            ;;
        esac
