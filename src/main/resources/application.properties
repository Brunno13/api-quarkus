# Application
quarkus.application.name=api-quarkus
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# Dev mode without local Docker/Testcontainers/database
%dev.quarkus.devservices.enabled=false
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.active=false
%dev.quarkus.datasource.health.enabled=false
%dev.quarkus.hibernate-orm.enabled=false
%dev.quarkus.flyway.enabled=false
%dev.quarkus.flyway.migrate-at-start=false

# OpenAPI / Swagger
quarkus.smallrye-openapi.info-title=API Quarkus Kotlin
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.swagger-ui.always-include=true

# Logs
quarkus.log.console.json=false
%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.pretty-print=false