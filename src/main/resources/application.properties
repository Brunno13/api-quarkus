# ==========================================================
# Application
# ==========================================================

quarkus.application.name=api-quarkus
quarkus.http.host=0.0.0.0
quarkus.http.port=8080


# ==========================================================
# Dev profile
# Local development without Docker/Testcontainers/database
# ==========================================================

%dev.quarkus.devservices.enabled=false
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.active=false
%dev.quarkus.datasource.health.enabled=false
%dev.quarkus.hibernate-orm.enabled=false
%dev.quarkus.flyway.enabled=false
%dev.quarkus.flyway.migrate-at-start=false


# ==========================================================
# Prod profile
# MariaDB will be configured through environment variables
# ==========================================================

%prod.quarkus.datasource.db-kind=mariadb
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

%prod.quarkus.datasource.jdbc.min-size=${DB_POOL_MIN_SIZE:1}
%prod.quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:8}

%prod.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.flyway.migrate-at-start=true


# ==========================================================
# OpenAPI / Swagger
# ==========================================================

quarkus.smallrye-openapi.info-title=API Quarkus Kotlin
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=API backend leve, modular e preparada para app mobile e web.

%dev.quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=false


# ==========================================================
# Health
# ==========================================================

quarkus.smallrye-health.root-path=/q/health


# ==========================================================
# Logs
# ==========================================================

%dev.quarkus.log.console.json=false

%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.pretty-print=false
%prod.quarkus.log.console.level=INFO


# ==========================================================
# JWT
# Placeholder. We will configure real keys during auth phase.
# ==========================================================

mp.jwt.verify.issuer=${JWT_ISSUER:api-quarkus}