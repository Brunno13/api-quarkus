# ==========================================================
# Application
# ==========================================================

quarkus.application.name=api-quarkus
quarkus.http.host=0.0.0.0
quarkus.http.port=8080


# ==========================================================
# MongoDB
# ==========================================================

quarkus.mongodb.database=${MONGODB_DATABASE:api_quarkus}


# ==========================================================
# MongoDB repository
# Enabled only when MongoDB persistence is configured
# ==========================================================

%dev.app.persistence.mongodb.enabled=false
%test.app.persistence.mongodb.enabled=false
%prod.app.persistence.mongodb.enabled=true


# ==========================================================
# Dev profile
# Local development without Docker or MongoDB
# ==========================================================

%dev.quarkus.devservices.enabled=false
%dev.quarkus.mongodb.devservices.enabled=false
%dev.quarkus.mongodb.active=false
%dev.quarkus.mongodb.health.enabled=false


# ==========================================================
# Test profile
# Unit and HTTP tests without Docker or MongoDB
# ==========================================================

%test.quarkus.devservices.enabled=false
%test.quarkus.mongodb.devservices.enabled=false
%test.quarkus.mongodb.active=false
%test.quarkus.mongodb.health.enabled=false


# ==========================================================
# Prod profile
# MongoDB connection supplied through environment variables
# ==========================================================

%prod.quarkus.mongodb.connection-string=${MONGODB_URI}
%prod.quarkus.mongodb.health.enabled=true


# ==========================================================
# OpenAPI / Swagger
# ==========================================================

quarkus.smallrye-openapi.info-title=API Quarkus Kotlin
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Reusable Kotlin and Quarkus backend API for mobile and web applications.

%dev.quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=false


# ==========================================================
# Health
# ==========================================================

quarkus.smallrye-health.root-path=/q/health


# ==========================================================
# Logs
# ==========================================================

%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.pretty-print=false
%prod.quarkus.log.console.level=INFO


# ==========================================================
# JWT
# Real token signing and verification will be configured later
# ==========================================================

mp.jwt.verify.issuer=${JWT_ISSUER:api-quarkus}

# Production JWT verification (externally managed public key)
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.mp.jwt.verify.publickey.algorithm=RS256
%prod.mp.jwt.verify.issuer=${JWT_ISSUER}
